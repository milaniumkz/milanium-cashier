name: MBusiness — isolated deployment
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect performs read-only host checks; deploy requires a dedicated HTTPS domain and TLS files.
        type: choice
        options: [inspect, prepare, certify, deploy]
        default: inspect
        required: true
      public_base_url:
        description: Dedicated public HTTPS origin for deploy; leave empty for inspect/prepare.
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: mbusiness-production
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      accounting-db:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: mbusiness_test
          POSTGRES_PASSWORD: synthetic-actions-test-only
          POSTGRES_DB: mbusiness_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U mbusiness_test" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run test:http
      - run: npm ci --no-audit --no-fund
        working-directory: modules/muchet/server
      - run: npm test
        working-directory: modules/muchet/server
        env:
          DATABASE_URL: postgresql://mbusiness_test:synthetic-actions-test-only@127.0.0.1:5432/mbusiness_test
      - name: Validate deployment shell
        run: for script in ops/github-*.sh; do bash -n "$script"; done
  accounting-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: modules/muchet
      - run: flutter test test/rest_api_client_test.dart
        working-directory: modules/muchet
      - run: flutter build web --release --target=lib/main_server.dart --base-href=/accounting/ --dart-define=MBUSINESS_EMBED=true --no-web-resources-cdn --pwa-strategy=none --no-wasm-dry-run
        working-directory: modules/muchet
      - uses: actions/upload-artifact@v4
        with:
          name: mbusiness-accounting-web
          path: modules/muchet/build/web/
          include-hidden-files: true
          retention-days: 7
  deploy:
    needs: [validate, accounting-ui]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: mbusiness-production
    env:
      SSH_HOST: ${{ vars.MBUSINESS_SSH_HOST || '89.126.192.185' }}
      SSH_USER: ${{ vars.MBUSINESS_SSH_USER || 'root' }}
      SSH_PORT: ${{ vars.MBUSINESS_SSH_PORT || '22' }}
      SSH_FINGERPRINT: ${{ vars.MBUSINESS_SSH_FINGERPRINT || 'SHA256:+Tocz2KkwW2hYTRerF6SA4DwanAyaFcQa3nrl+M2dcg' }}
      PUBLIC_BASE_URL: ${{ inputs.public_base_url || vars.MBUSINESS_PUBLIC_BASE_URL }}
      OPERATION: ${{ inputs.operation }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mbusiness-accounting-web
          path: modules/muchet/build/web/
      - name: Install SSH client helper on the Actions runner only
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Verify SSH host identity and run isolated operation
        env:
          SSHPASS: ${{ secrets.MBUSINESS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SSHPASS" ]] || { echo 'Set MBUSINESS_SSH_PASSWORD in environment mbusiness-production.'; exit 1; }
          [[ "$SSH_HOST" =~ ^[0-9.]+$ && "$SSH_PORT" =~ ^[0-9]+$ && "$SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || exit 1
          known="$RUNNER_TEMP/mbusiness_known_hosts"
          ssh-keyscan -T 10 -p "$SSH_PORT" -t ecdsa "$SSH_HOST" > "$known" 2>/dev/null
          fingerprint=$(ssh-keygen -lf "$known" -E sha256 | awk '{print $2}')
          [[ "$fingerprint" == "$SSH_FINGERPRINT" ]] || { echo 'SSH host fingerprint mismatch; verify in hosting console.'; exit 1; }
          chmod 600 "$known"
          options=(-o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" -o ConnectTimeout=15 -o PreferredAuthentications=password -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1)
          remote_dir="/root/mbusiness-upload-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          sshpass -e ssh -p "$SSH_PORT" "${options[@]}" "$SSH_USER@$SSH_HOST" "umask 077; mkdir '$remote_dir'"
          remote_script="$remote_dir/bootstrap.sh"
          sshpass -e scp -P "$SSH_PORT" "${options[@]}" ops/github-deploy.sh "$SSH_USER@$SSH_HOST:$remote_script"
          if [[ "$OPERATION" == inspect ]]; then
            printf -v command 'bash %q inspect' "$remote_script"
          else
            if [[ "$OPERATION" != prepare && -z "$PUBLIC_BASE_URL" ]]; then
              echo 'Set public_base_url and provision dedicated TLS before deployment.'; exit 1
            fi
            if [[ "$OPERATION" == prepare ]]; then PUBLIC_BASE_URL=https://mbusiness.invalid:8443;fi
            archive="$RUNNER_TEMP/mbusiness-$GITHUB_SHA.tar.gz"
            git archive --format=tar -o "$RUNNER_TEMP/mbusiness-release.tar" HEAD
            tar -rf "$RUNNER_TEMP/mbusiness-release.tar" modules/muchet/build/web
            gzip -c "$RUNNER_TEMP/mbusiness-release.tar" > "$archive"
            checksum=$(sha256sum "$archive" | awk '{print $1}')
            sshpass -e scp -P "$SSH_PORT" "${options[@]}" "$archive" "$SSH_USER@$SSH_HOST:$remote_dir/mbusiness-$GITHUB_SHA.tar.gz"
            printf -v command 'bash %q %q %q %q %q %q' "$remote_script" "$OPERATION" "$GITHUB_SHA" "$remote_dir/mbusiness-$GITHUB_SHA.tar.gz" "$checksum" "$PUBLIC_BASE_URL"
          fi
          sshpass -e ssh -p "$SSH_PORT" "${options[@]}" "$SSH_USER@$SSH_HOST" "$command"
          if [[ "$OPERATION" == deploy ]]; then
            curl --fail --silent --show-error --retry 3 --max-time 20 "$PUBLIC_BASE_URL/healthz"
            curl --fail --silent --show-error --max-time 20 "$PUBLIC_BASE_URL/" | grep -Fq MBusiness
          fi
