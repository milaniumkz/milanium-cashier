services:
  cashier:
    build: .
    init: true
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3080
      DATA_DIR: /app/data
      CONNECTOR_CONFIG: /app/config/android.live.json
    ports:
      - "127.0.0.1:3080:3080"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    shm_size: 1gb
    stop_grace_period: 65s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
